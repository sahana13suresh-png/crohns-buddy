<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Background -->
  <rect width="300" height="300" rx="16" fill="#dbeafe"/>
  
  <!-- Large intestine / colon - matching the reference exactly -->
  <!-- The colon is a U-shape: ascending on left, transverse on top, descending on right curving inward, sigmoid at bottom center -->
  
  <!-- Main colon body fill -->
  <path d="
    M 95 55
    C 75 55, 58 65, 55 85
    C 52 105, 52 120, 52 140
    C 52 160, 52 175, 55 190
    C 58 205, 68 215, 85 218
    C 100 220, 115 220, 135 220
    C 155 220, 170 218, 185 212
    C 200 206, 210 195, 215 180
    C 220 165, 220 148, 218 132
    C 216 116, 208 105, 195 100
    C 182 95, 172 100, 165 110
    C 158 120, 155 135, 155 150
    C 155 165, 158 178, 160 188
    C 162 198, 158 208, 152 215
    C 146 225, 145 235, 148 245
    C 150 252, 148 258, 145 262
  " fill="#deb760" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Haustra bumps (the scalloped edges) - outer left side -->
  <circle cx="48" cy="90" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="45" cy="110" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="44" cy="130" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="45" cy="150" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="46" cy="170" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="50" cy="190" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Haustra bumps - top transverse -->
  <circle cx="80" cy="50" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="100" cy="46" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="120" cy="44" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="140" cy="44" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="160" cy="46" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="180" cy="50" r="8" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="198" cy="58" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Haustra bumps - right descending (outer) -->
  <circle cx="222" cy="115" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="225" cy="135" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="224" cy="155" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="220" cy="175" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="212" cy="192" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Haustra bumps - bottom -->
  <circle cx="195" cy="215" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="175" cy="222" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="155" cy="225" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="135" cy="225" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="115" cy="223" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="95" cy="218" r="7" fill="#d4a94d" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Haustra bumps - inner right curve -->
  <circle cx="162" cy="115" r="6" fill="#d4a94d" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="158" cy="135" r="6" fill="#d4a94d" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="157" cy="155" r="6" fill="#d4a94d" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="160" cy="175" r="6" fill="#d4a94d" stroke="#1a1a1a" stroke-width="2.5"/>
  
  <!-- Sigmoid / rectum at bottom -->
  <ellipse cx="148" cy="248" rx="8" ry="12" fill="#deb760" stroke="#1a1a1a" stroke-width="4"/>
  <path d="M 148 260 L 148 268 L 146 272" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small intestine / ileum (thin tube going to bottom left) -->
  <path d="M 65 205 C 58 210, 52 218, 48 228 C 44 238, 42 245, 44 250" 
        fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 65 205 C 58 210, 52 218, 48 228 C 44 238, 42 245, 44 250" 
        fill="none" stroke="#deb760" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
