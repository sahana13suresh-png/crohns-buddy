AWSTemplateFormatVersion: '2010-09-09'
Description: Crohn's Buddy production hosting, data store, scheduled cleanup, and cost guardrail.

Parameters:
  DeployHosting:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create Amplify hosting after the CodeCommit repository contains the application.
  RepositoryName:
    Type: String
    Default: crohns-buddy-deploy
  TableName:
    Type: String
    Default: crohns-buddy-meal-plans
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
  CronSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  AlertEmail:
    Type: String
    Default: sahana13suresh@gmail.com
  FirebaseApiKey:
    Type: String
    NoEcho: true
    Default: ''
  FirebaseAuthDomain:
    Type: String
    Default: ''
  FirebaseProjectId:
    Type: String
    Default: ''
  FirebaseStorageBucket:
    Type: String
    Default: ''
  FirebaseMessagingSenderId:
    Type: String
    Default: ''
  FirebaseAppId:
    Type: String
    Default: ''
  AuthProviders:
    Type: String
    Default: ''
  PerspectiveApiKey:
    Type: String
    NoEcho: true
    Default: ''

Conditions:
  HostingEnabled: !Equals [!Ref DeployHosting, 'true']
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  SourceRepository:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      RepositoryDescription: Deployment source for Crohn's Buddy.
      Tags:
        - Key: application
          Value: crohns-buddy

  MealPlanTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: mealPlanId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: mealPlanId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: application
          Value: crohns-buddy

  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows Amplify Hosting to pull the Crohn's Buddy CodeCommit repository.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullDeploymentSource
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codecommit:GitPull
                Resource: !GetAtt SourceRepository.Arn

  AmplifyComputeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege runtime access for Crohn's Buddy SSR routes.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CrohnsBuddyRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MealPlanStoreItemAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt MealPlanTable.Arn
              - Sid: BedrockInference
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: CrohnsBuddyMonthlyCost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 20
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  AmplifyApp:
    Type: AWS::Amplify::App
    Condition: HostingEnabled
    Properties:
      Name: crohns-buddy
      Description: Crohn's Buddy Next.js application.
      Platform: WEB_COMPUTE
      Repository: !GetAtt SourceRepository.CloneUrlHttp
      IAMServiceRole: !GetAtt AmplifyServiceRole.Arn
      ComputeRoleArn: !GetAtt AmplifyComputeRole.Arn
      EnableBranchAutoDeletion: true
      JobConfig:
        BuildComputeType: STANDARD_8GB
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm ci
                - env | grep -E '^(MEAL_PLAN_TABLE_NAME|MEAL_PLAN_AWS_REGION|BEDROCK_MODEL_ID|CRON_SECRET|PERSPECTIVE_API_KEY|NEXT_PUBLIC_FIREBASE_|NEXT_PUBLIC_AUTH_PROVIDERS)=' >> .env.production
            build:
              commands:
                - npm run build
          artifacts:
            baseDirectory: .next
            files:
              - '**/*'
          cache:
            paths:
              - .next/cache/**/*
              - node_modules/**/*
      EnvironmentVariables:
        - Name: MEAL_PLAN_TABLE_NAME
          Value: !Ref MealPlanTable
        - Name: MEAL_PLAN_AWS_REGION
          Value: !Ref AWS::Region
        - Name: BEDROCK_MODEL_ID
          Value: !Ref BedrockModelId
        - Name: CRON_SECRET
          Value: !Ref CronSecret
        - Name: PERSPECTIVE_API_KEY
          Value: !Ref PerspectiveApiKey
        - Name: NEXT_PUBLIC_FIREBASE_API_KEY
          Value: !Ref FirebaseApiKey
        - Name: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
          Value: !Ref FirebaseAuthDomain
        - Name: NEXT_PUBLIC_FIREBASE_PROJECT_ID
          Value: !Ref FirebaseProjectId
        - Name: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
          Value: !Ref FirebaseStorageBucket
        - Name: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
          Value: !Ref FirebaseMessagingSenderId
        - Name: NEXT_PUBLIC_FIREBASE_APP_ID
          Value: !Ref FirebaseAppId
        - Name: NEXT_PUBLIC_AUTH_PROVIDERS
          Value: !Ref AuthProviders
      Tags:
        - Key: application
          Value: crohns-buddy

  ProductionBranch:
    Type: AWS::Amplify::Branch
    Condition: HostingEnabled
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: main
      Description: Production branch.
      Stage: PRODUCTION
      Framework: Next.js - SSR
      EnableAutoBuild: true
      EnableSkewProtection: true
      ComputeRoleArn: !GetAtt AmplifyComputeRole.Arn

  SweepFunctionRole:
    Type: AWS::IAM::Role
    Condition: HostingEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteSweepLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/crohns-buddy-pending-deletion-sweep:*

  SweepFunction:
    Type: AWS::Lambda::Function
    Condition: HostingEnabled
    Properties:
      FunctionName: crohns-buddy-pending-deletion-sweep
      Description: Invokes the authenticated Crohn's Buddy pending-deletion sweep.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SweepFunctionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          SWEEP_URL: !Sub https://main.${AmplifyApp.DefaultDomain}/api/internal/pending-deletion-sweep
          CRON_SECRET: !Ref CronSecret
      Code:
        ZipFile: |
          exports.handler = async () => {
            const response = await fetch(process.env.SWEEP_URL, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.CRON_SECRET}`,
              },
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Sweep returned HTTP ${response.status}: ${body.slice(0, 500)}`);
            }
            console.log(JSON.stringify({ statusCode: response.status, body }));
            return { statusCode: response.status };
          };
      Tags:
        - Key: application
          Value: crohns-buddy

  DailySweepRule:
    Type: AWS::Events::Rule
    Condition: HostingEnabled
    Properties:
      Name: crohns-buddy-daily-pending-deletion-sweep
      Description: Runs the pending deletion sweep once daily at 03:00 UTC.
      ScheduleExpression: cron(0 3 * * ? *)
      State: ENABLED
      Targets:
        - Id: PendingDeletionSweep
          Arn: !GetAtt SweepFunction.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 2

  AllowEventBridgeSweepInvocation:
    Type: AWS::Lambda::Permission
    Condition: HostingEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SweepFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailySweepRule.Arn

Outputs:
  RepositoryCloneUrl:
    Description: HTTPS clone URL for deployment source.
    Value: !GetAtt SourceRepository.CloneUrlHttp
  MealPlanTableName:
    Value: !Ref MealPlanTable
  AmplifyComputeRoleArn:
    Value: !GetAtt AmplifyComputeRole.Arn
  AmplifyAppId:
    Condition: HostingEnabled
    Value: !GetAtt AmplifyApp.AppId
  ProductionUrl:
    Condition: HostingEnabled
    Value: !Sub https://main.${AmplifyApp.DefaultDomain}
